name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permissions required for both gh-pages branch push and GitHub Actions Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent deployment clashes
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build site
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          npm run build
          touch dist/.nojekyll

      # Deploy directly to gh-pages branch (works 100% reliably with "Deploy from a branch")
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: true

      # Also prepare Pages artifact for native GitHub Actions Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

  # Native GitHub Actions Pages deployment (works when Pages source is set to GitHub Actions)
  deploy-github-actions-pages:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
